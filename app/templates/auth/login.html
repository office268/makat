{% extends "base.html" %}
{% block title %}התחברות{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card mt-4">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">התחברות</h1>
        <p class="text-muted small mb-4">קטלוג מק"טים לחלקי רכב</p>
        <form method="post">
          {{ csrf_field() }}
          <div class="mb-3">
            <label class="form-label">דוא"ל</label>
            <input class="form-control" type="email" name="email" dir="ltr"
                   value="{{ form.get('email','') }}" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">סיסמה</label>
            <input class="form-control" type="password" name="password" required>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="remember" value="1" id="remember">
            <label class="form-check-label small" for="remember">זכור אותי</label>
          </div>
          <button class="btn btn-primary w-100">כניסה</button>
        </form>
        <hr class="my-4">
        <p class="text-center small mb-1">
          אין לך חשבון? <a href="{{ url_for('auth.signup') }}">רישום ארגון חדש</a>
        </p>
        <p class="text-center small mb-0">
          <a class="text-muted" href="{{ url_for('auth.welcome') }}">חזרה למסך הפתיחה</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
