{% extends "base.html" %}
{% block title %}הצטרפות לארגון{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card mt-4"><div class="card-body p-4">
      <h1 class="h4 mb-1">הצטרפות ל{{ invitation.organization.name }}</h1>
      <p class="text-muted small mb-4">
        הוזמנת כ<strong>{{ invitation.role_label }}</strong> עם הכתובת
        <span dir="ltr">{{ invitation.email }}</span>. בחר סיסמה כדי להיכנס.
      </p>
      <form method="post" class="row g-3">
        {{ csrf_field() }}
        <div class="col-12">
          <label class="form-label">שם מלא</label>
          <input class="form-control" name="full_name">
        </div>
        <div class="col-md-6">
          <label class="form-label">סיסמה *</label>
          <input class="form-control" type="password" name="password" required minlength="8">
          <div class="form-text">לפחות 8 תווים</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">אימות סיסמה *</label>
          <input class="form-control" type="password" name="password_confirm" required>
        </div>
        <div class="col-12"><button class="btn btn-primary">הצטרפות</button></div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
